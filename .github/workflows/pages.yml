# SHADOW 市场 · GitHub Pages 发布（Actions artifact 方式）
#
# 决策依据：D:\FOLLOWSPEAK\docs\111-market-architecture.md §6.4 部署拓扑（GitHub Pages 备选演示）
#           §2.4 URL 策略（P0 使用 hash 路由 → 静态托管零配置，无需 404 fallback）
#           §9 质量门（部署前必须通过数据/契约/静态审计；任何校验失败不发布）
#
# 一次性设置（仓库 Settings → Pages）：
#   Source = GitHub Actions（不要选 Deploy from a branch）
# 首次推送 main（market/** 变更）或手动 workflow_dispatch 即触发。
name: Deploy SHADOW Market (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'market/**'
      - 'tools/**'
      - 'deploy/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate & build artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS syntax check (零构建原生 ESM)
        run: |
          set -euo pipefail
          node --check market/serve.mjs
          node --check market/sw.js
          find market/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate .shadowcourse packages
        run: |
          set -euo pipefail
          if [ ! -f tools/shadowcourse/validate.mjs ]; then
            echo "::error::tools/shadowcourse/validate.mjs 缺失（数据/构建层未就绪），拒绝发布"
            exit 1
          fi
          node tools/shadowcourse/validate.mjs --dir market/data/packages

      - name: Validate catalog v2 (schema + sha256/size 与文件一致)
        run: |
          set -euo pipefail
          if [ ! -f tools/catalog/validate-catalog.mjs ]; then
            echo "::error::tools/catalog/validate-catalog.mjs 缺失（catalog v2 校验器未就绪），拒绝发布"
            exit 1
          fi
          node tools/catalog/validate-catalog.mjs

      - name: Data contract check (QA 独立实现，交叉验证)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa"
          node tools/qa/market/data-contract-check.mjs --report="$RUNNER_TEMP/qa/report-data-contract.json"

      - name: Static audit (品牌/PWA/合规/无 CDN/声明式插件/部署配置)
        run: |
          set -euo pipefail
          node tools/qa/market/static-audit.mjs --report="$RUNNER_TEMP/qa/report-static-audit.json"

      - name: Upload QA reports (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: ${{ runner.temp }}/qa/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 关键：artifact = market/ 目录内容（站点根）。hash 路由无需 404.html。
      - name: Upload Pages artifact (market/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: market

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
